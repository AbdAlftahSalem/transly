name: shop_json
description: "transly example: the same shop localized with easy_localization (nested .json), Arabic as the base language."
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  easy_localization: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  shared_preferences: any
  transly:
    path: ../..

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
